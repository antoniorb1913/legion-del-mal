
name: Comunicador de la Legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: '¿Que villano envía el mensaje?'
        required: true
        type: choice
        options:
          - 'Lex Luthor'
          - 'Magneto'
          - 'Joker'
          - 'Mystique'
          - 'Brainiac'
      mensaje:
        description: 'Mensaje para el consejo'
        required: true
        default: "La misión fue un éxito"

      prioridad:
        description: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Critica
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: sudo apt-get install -y cowsay


      - name: Imprimir inputs
        run: |
          echo "================================"
          echo "    Transmisión interceptada"
          echo "================================"
          echo ""
          echo "DE: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
          echo "---- Mensaje ----"
          cowsay -f eyes "${{ inputs.mensaje }}"
          echo " --- ${{ inputs.villano }}"
          echo "..."
